apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-sync
spec:
  provider: azure
  secretObjects:
    - secretName: firevault-k8s-secret
      type: Opaque
      data:
        - objectName: azure-storage-account-name
          key: AZURE_STORAGE_ACCOUNT_NAME
        - objectName: azure-storage-account-key
          key: AZURE_STORAGE_ACCOUNT_KEY
        - objectName: azure-container-name
          key: AZURE_CONTAINER_NAME
        - objectName: destinations-prometheus-password
          key: DESTINATIONS_PROMETHEUS_PASSWORD
        - objectName: destinations-loki-password
          key: DESTINATIONS_LOKI_PASSWORD
        - objectName: destinations-otlp-password
          key: DESTINATIONS_OTLP_PASSWORD
        - objectName: fleetmanagement-password
          key: FLEETMANAGEMENT_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "f15c295e-62f6-4610-a7ed-1dfa9b3ad954"
    keyvaultName: "firevault-secrets"
    tenantId: "34cc7ab5-fd16-446f-bd35-2d04775d2de1"
    objects: |
      array:
        - |
          objectName: azure-storage-account-name
          objectType: secret
        - |
          objectName: azure-storage-account-key
          objectType: secret
        - |
          objectType: secret
        - |
          objectName: destinations-prometheus-password
          objectType: secret
        - |
          objectName: destinations-loki-password
          objectType: secret
        - |
          objectName: destinations-otlp-password
          objectType: secret
        - |
          objectName: fleetmanagement-password
          objectType: secret
